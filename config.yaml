# config.yaml
textSpeed: 300                     # ms per story line
choiceSpeed: 300                   # ms per choice fade
fadeDuration: 400                  # fade-in duration in ms
effectTransitionTime: 2000         # ms when fading in and out weather and back/foreground effects
backgroundTransitionTime: 2000     # ms when fading between background colour states

maxTextWidth: 700

scenePadding: "2rem"
paceMultipliers:
  fastest: 0.125
  faster: 0.25
  fast: 0.5
  slow: 2
  slower: 4
  slowest: 8

# the look of the story: everything a reader sees before they touch Settings
theme:
  font: "Georgia, 'Iowan Old Style', 'Times New Roman', serif"   # story text
  uiFont: "system-ui, -apple-system, 'Segoe UI', sans-serif"     # toolbar, panels, buttons
  textColour: "#e8e6e3"
  darkTextColour: "#1b1b1f"        # text colour over light backgrounds
  backgroundColour: "#0e0e12"
  accentColour: "#0a84ff"          # primary buttons, hovers, focus rings
  cornerRadius: "8px"              # buttons, choices, panels

  # how /pov sections are drawn:
  #   header - a subtle coloured heading with a hairline under the block
  #   box    - the original outlined panel around the whole block
  povStyle: "header"

povCaseInsensitive: true
povColours:
  You: mediumpurple
